# Builds platform installers and attaches them to a GitHub Release.
#
# Triggered by pushing a version tag (git tag v0.1.0 && git push --tags),
# or manually via the Actions tab / `gh workflow run release.yml` to test
# the packaging without cutting a release (the publish job is skipped
# unless the run is for a tag).
#
# Artifacts:
#   Linux   -> bare-binary tar.gz
#   macOS   -> universal RustyDemon.app inside a .dmg  (scripts/macos-bundle.sh)
#   Windows -> .msi installer  (rustydemon/wix/main.wxs via cargo-wix)
#
# Installers are currently unsigned. Apple Dev ID notarization and Windows
# Authenticode signing are separate follow-ups.
#
# Until then a release carries two things anyone can check for themselves:
#   SHA256SUMS.txt        -> the checksum of every file in the release
#   a build attestation   -> GitHub's signed statement that each file was
#                            built by this workflow from the tagged commit.
#                            Check one with:
#                              gh attestation verify <file> --repo HoldMyBeer-gg/rustydemon
#
# After publishing, the AUR recipe in packaging/aur/rustydemon-bin is pointed
# at the new release and committed to main, so it cannot fall a version behind.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  # Both are needed to sign and store the build attestation.
  id-token: write
  attestations: write

jobs:
  linux:
    # Pinned so the glibc the release binary needs does not jump when
    # ubuntu-latest moves to a newer image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      # No system packages are installed: nothing in the dependency tree
      # links one at build time (see the Clippy job in ci.yml).
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu -p rustydemon
      - name: Package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/rustydemon dist/
          tar -C dist -czf "rustydemon-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" rustydemon
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: rustydemon-*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build universal .app + .dmg
        run: ./scripts/macos-bundle.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/RustyDemon-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y
      - name: Install cargo-wix
        run: cargo install cargo-wix
      - name: Build MSI
        run: cargo wix -p rustydemon --nocapture
      - name: Collect MSI
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\wix\*.msi "dist\rustydemon-$v-x86_64-pc-windows-msvc.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist\*.msi

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Write checksums
        run: sha256sum *.tar.gz *.dmg *.msi | tee SHA256SUMS.txt
      - name: Attest that these files came from this workflow
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            *.tar.gz
            *.dmg
            *.msi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.dmg
            *.msi
            SHA256SUMS.txt

  # Point the AUR recipe at the release that was just published. Runs last:
  # the recipe needs the tarball checksum, which exists only once it is built.
  aur-recipe:
    needs: release
    # Only for plain x.y.z tags; a pre-release is not what the recipe installs.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Tags are needed: the license and icons are hashed at the tag.
          fetch-depth: 0
      - name: Rewrite the recipe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          tarball="rustydemon-${TAG#v}-x86_64-unknown-linux-gnu.tar.gz"
          sum=$(awk -v f="$tarball" '$2 == f { print $1 }' "$RUNNER_TEMP/SHA256SUMS.txt")
          test -n "$sum" || { echo "no checksum for $tarball in SHA256SUMS.txt"; exit 1; }
          scripts/aur-bump.sh "${TAG#v}" "$sum"
      - name: Commit to main if the recipe changed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- packaging/aur; then
            echo "Recipe already at ${TAG#v}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "packaging: AUR recipe follows ${TAG#v}" -- packaging/aur
          git push origin HEAD:main
