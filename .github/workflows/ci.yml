name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - name: Clippy
        run: >
          cargo clippy
          --workspace
          --all-targets
          --
          -D warnings
          -A clippy::manual_let_else
          -A clippy::map_unwrap_or
          -A clippy::redundant_closure_for_method_calls
          -A clippy::cloned_instead_of_copied

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - run: cargo test --workspace

  # ── Security audit ──────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0204 (crossbeam-epoch), -0190 (anyhow) and -0186
          # (memmap2) were fixed by bumping to patched versions in Cargo.lock.
          # The rest are transitive deps under eframe/winit that can't be
          # bumped without a major eframe upgrade:
          #   0194/0195 quick-xml DoS — reached only via wayland-scanner and
          #     zbus_xml, which parse trusted local Wayland/D-Bus XML, never
          #     attacker-controlled network input, so the DoS vector is moot.
          #   0105 core2, 0119 number_prefix, 0192 ttf-parser — unmaintained,
          #     no known vulnerability.
          ignore: RUSTSEC-2024-0436,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0105,RUSTSEC-2025-0119,RUSTSEC-2026-0192
