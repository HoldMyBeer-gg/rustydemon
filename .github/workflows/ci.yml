name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    # Linux jobs run in Debian (the official Rust image on Debian 13), the
    # base of the Linux desktops the app is tested on by hand.
    #
    # They install no system packages.  Nothing in the dependency tree
    # links a system library at build time: file dialogs go through the XDG
    # portal, not GTK; HTTP uses rustls, not OpenSSL; Wayland and xkbcommon
    # are loaded at run time.  An apt-get step used to sit here, and on
    # 2026-11-11 it hung every Linux job for 30+ minutes when GitHub's
    # runners could not resolve the Ubuntu package mirrors.  If a future
    # dependency does need a system library, this job fails at link time,
    # which is the cue to add the package back.
    runs-on: ubuntu-latest
    container: rust:1-slim-trixie
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: >
          cargo clippy
          --workspace
          --all-targets
          --
          -D warnings
          -A clippy::manual_let_else
          -A clippy::map_unwrap_or
          -A clippy::redundant_closure_for_method_calls
          -A clippy::cloned_instead_of_copied

  # ── Tests ───────────────────────────────────────────────────────────────────
  # Runs on every OS we ship for.  The unit tests need no game install, so
  # this is the "builds and isn't broken" check for macOS and Windows, which
  # were previously only compiled at release time.
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs in Debian with no system packages; see the Clippy
          # job above for why.
          - name: debian-13
            os: ubuntu-latest
            container: rust:1-slim-trixie
          - name: macos-latest
            os: macos-latest
          - name: windows-latest
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # Empty for macOS and Windows, which means "no container".
    container: ${{ matrix.container }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ── AUR recipe tooling ──────────────────────────────────────────────────────
  # The release workflow rewrites packaging/aur/rustydemon-bin with
  # scripts/aur-bump.sh. This checks that script, and that the committed
  # recipe is what the script would produce.
  # The library crates are published to crates.io. Packaging builds each one
  # from its tarball alone, which catches a file reached from outside the
  # crate directory (an include_str! path, a missing README) before a release.
  package:
    name: Crates package cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p rustydemon-blp2 -p rustydemon-gr2 -p rustydemon-lib

  aur-recipe:
    name: AUR recipe script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The test reads the license and icons at the recipe's release tag.
          fetch-depth: 0
      - run: scripts/aur-bump.test.sh

  # ── Security audit ──────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0204 (crossbeam-epoch), -0190 (anyhow) and -0186
          # (memmap2) were fixed by bumping to patched versions in Cargo.lock.
          # The rest are transitive deps under eframe/winit that can't be
          # bumped without a major eframe upgrade:
          #   0194/0195 quick-xml DoS — still reached through zbus_xml 4.0
          #     (quick-xml 0.30), which the accessibility stack pins:
          #     egui 0.29 -> accesskit_unix 0.12 -> atspi-common 0.6 ->
          #     zbus-lockstep 0.4 -> zbus_xml 4.  It parses trusted local
          #     D-Bus interface XML, never input from a user or the network,
          #     so the DoS has nothing to act on.  Goes away with an egui
          #     upgrade.  The other path, wayland-scanner, is fixed: it is
          #     on quick-xml 0.41.
          #   0119 number_prefix, 0192 ttf-parser — unmaintained, no known
          #     vulnerability.
          #   0370 zvariant, 0371 zbus_names, 0372 zvariant_derive —
          #     unmaintained since they were merged into zbus 6.0, with no
          #     patched version to move to.  Reached through zbus 4 and 5,
          #     which the accessibility stack and the file dialogs pin.  No
          #     known vulnerability.  Goes away when those move to zbus 6.
          ignore: RUSTSEC-2024-0436,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2025-0119,RUSTSEC-2026-0192,RUSTSEC-2026-0370,RUSTSEC-2026-0371,RUSTSEC-2026-0372
