[package]
name        = "rustydemon"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license-file.workspace = true
repository.workspace = true
description = "CASC and MPK archive explorer, cross-platform GUI"

[[bin]]
name = "rustydemon"
path = "src/main.rs"

[dependencies]
rustydemon-lib  = { path = "../rustydemon-lib", features = ["cdn"] }
rustydemon-blp2 = { path = "../rustydemon-blp2" }
rustydemon-gr2  = { path = "../rustydemon-gr2" }
rustydemon-messiah = { version = "0.9.0", path = "../rustydemon-messiah" }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    # Linux backends: required because we disabled default-features.
    # Without these, winit fails with "platform not supported".
    "x11",
    "wayland",
    # Publish the egui widget tree to the platform accessibility bus
    # (AT-SPI on Linux, UIA on Windows, NSAccessibility on macOS) so
    # screen readers, and tools like bad-ass-mcp, can drive the UI.
    "accesskit",
    # Both were always on before egui 0.37 and are opt-in since.
    # clipboard: Copy Hash / Copy CKey / Copy Version, and paste in the
    # search box.  links: the About window's link cards open a browser.
    "clipboard",
    "links",
] }
# monochrome_emoji_fonts: the bundled emoji fonts (also opt-in since 0.37).
# The file-tree icons and a few button glyphs come from them; without the
# feature they render as empty boxes.
egui        = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui-wgpu   = "0.37"
wgpu        = "30"
bytemuck    = { version = "1", features = ["derive"] }
glam        = "0.29"
wow-wmo     = "0.6.4"
wow-alchemy-m2   = "0.2.0"
wow-alchemy-data = "0.2.0"
rfd         = "0.15"
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texture2ddecoder = "0.1"

# Audio playback for .wav/.mp3/.ogg in the preview panel.
#
# rodio -> cpal, which uses WASAPI on Windows, CoreAudio on macOS,
# and ALSA on Linux.  The Linux path needs `pkg-config` + the
# `libasound2-dev` (Debian/Ubuntu) / `alsa-lib` (Arch) development
# package at build time, which a stock SteamOS install does not have.
# So on Linux the dependency is optional, behind the `audio` feature,
# and a build without it compiles a stub that says playback is not
# built in.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rodio = { version = "0.19", default-features = false, features = ["mp3", "vorbis", "wav"] }

[target.'cfg(target_os = "linux")'.dependencies]
rodio = { version = "0.19", default-features = false, features = ["mp3", "vorbis", "wav"], optional = true }

# Embeds the icon in the Windows executable (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Sound in the preview panel on Linux, through ALSA.
audio = ["dep:rodio"]
